<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generators</title>
<style>
:root { --bg: #f5f5f7; --card: #ffffff; --label: #1d1d1f; --label2: #6e6e73; --sep: rgba(0,0,0,.08); --tint: #0071e3; --tile: #1d1d1f; }
@media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --label: #f5f5f7; --label2: #98989d; --sep: rgba(255,255,255,.1); --tint: #2997ff; --tile: #2c2c2e; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--label); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo", "Pretendard", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; display: flex; justify-content: center; }
main { width: 100%; max-width: 560px; padding: 64px 20px 48px; }
header { text-align: center; margin-bottom: 36px; }
.mark { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 16px; background: var(--tile); display: grid; place-items: center; }
h1 { font-size: 28px; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 8px; font-weight: 700; }
header p { margin: 0; color: var(--label2); }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
a.card { display: grid; grid-template-columns: 76px 1fr 16px; gap: 16px; align-items: center; padding: 14px 18px 14px 14px; background: var(--card); border-radius: 18px; color: inherit; text-decoration: none; box-shadow: 0 0 0 .5px var(--sep), 0 1px 2px rgba(0,0,0,.04); transition: transform .15s ease, box-shadow .15s ease; }
a.card:hover { transform: translateY(-1px); box-shadow: 0 0 0 .5px var(--sep), 0 6px 18px rgba(0,0,0,.08); }
a.card:active { transform: scale(.99); }
a.card:focus-visible { outline: 3px solid var(--tint); outline-offset: 2px; }
.thumb { width: 76px; height: 76px; border-radius: 14px; background: var(--tile); display: grid; place-items: center; overflow: hidden; }
.thumb svg { width: 56px; height: 56px; }
.title { font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
.desc { color: var(--label2); font-size: 13.5px; margin-top: 2px; }
.chev { color: var(--label2); }
footer { text-align: center; color: var(--label2); font-size: 12px; margin-top: 32px; }
</style>
</head>
